<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explosão do Emoji</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    background:radial-gradient(circle, #171714 0%, #665500 40%, #000000 100%);
    display:flex;
    justify-content:center;
    align-items:center;
}

#emojiPrincipal{
    width:120px;
    position:absolute;
    animation:crescer 3s forwards;
}

@keyframes crescer{
    0%{
        transform:scale(0.2) rotate(0deg);
    }
    100%{
        transform:scale(7) rotate(15deg);
    }
}

.particula{
    position:absolute;
    pointer-events:none;
}

@keyframes voar{
    from{
        transform:translate(0,0) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translate(var(--x),var(--y)) rotate(720deg);
        opacity:0;
    }
}

h1{
    position:absolute;
    top:30px;
    color:#171615;
    font-family:Arial;
    text-shadow:0 0 20px #0f0f0e;
    letter-spacing:3px;
}
</style>
</head>

<body>



<img
id="emojiPrincipal"
src="emoji_transparente.png"
alt="Emoji">

<script>

const emoji = document.getElementById("emojiPrincipal");

setTimeout(() => {

    emoji.style.display = "none";

    for(let i=0;i<80;i++){

        const p = document.createElement("img");

        p.src = "emoji_transparente.png";
        p.classList.add("particula");

        const tamanho = Math.random()*120 + 40;

        p.style.width = tamanho + "px";

        p.style.left = window.innerWidth/2 + "px";
        p.style.top = window.innerHeight/2 + "px";

        const x =
            (Math.random()-0.5)*2500 + "px";

        const y =
            (Math.random()-0.5)*2000 + "px";

        p.style.setProperty("--x",x);
        p.style.setProperty("--y",y);

        const tempo =
            Math.random()*2 + 2;

        p.style.animation =
            `voar ${tempo}s forwards`;

        document.body.appendChild(p);

        setTimeout(()=>{
            p.remove();
        },tempo*1000);

    }

},3000);

</script>

</body>
</html>
