<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p chucrinha</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #8f1853, #8f1853);
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 3rem;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);
            margin-bottom: 40px;
        }

        button {
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 22px;
            cursor: pointer;
            margin: 10px;
            transition: .2s;
        }

        #sim {
            background: #ff0000;
            color: white;
            position: absolute;
        }

        #nao {
            background: #4CAF50;
            color: white;
        }

        #heart {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            display: none;
            z-index: 1000;
        }

        .grow {
            animation: crescer 1.2s forwards;
        }

        @keyframes crescer {
            from {
                transform: translate(-50%, -50%) scale(1);
            }

            to {
                transform: translate(-50%, -50%) scale(15);
            }
        }

        .particle {
            position: absolute;
            pointer-events: none;
            animation: explodir 4s linear forwards;
        }

        @keyframes explodir {
            from {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            to {
                opacity: 0;
                transform: translate(var(--x), var(--y)) scale(0.2);
            }
        }

        .shine {
            animation: brilho 3s infinite alternate;
        }

        @keyframes brilho {
            from {
                filter: brightness(100%);
            }

            to {
                filter: brightness(150%);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1></h1>

        <button id="sim">SIM </button>
        <button id="nao">NÃO </button>
    </div>

    <div id="heart">❤️</div>

    <script>

        const btnSim = document.getElementById("sim");

        btnSim.style.left = "55%";
        btnSim.style.top = "60%";

        btnSim.addEventListener("mouseover", () => {

            const largura = window.innerWidth - 150;
            const altura = window.innerHeight - 100;

            btnSim.style.left = Math.random() * largura + "px";
            btnSim.style.top = Math.random() * altura + "px";

        });

        document.getElementById("nao").addEventListener("click", () => {

            const mensagens = [
                "TMJ CHUCRINHA LINDA",
                "A VOLTA DAS ++",
                "EBAAAAAA"
            ];

            alert(
                mensagens[Math.floor(Math.random() * mensagens.length)]
            );

            const heart = document.getElementById("heart");

            heart.style.display = "block";
            heart.classList.add("grow");

            setTimeout(() => {

                heart.style.display = "none";

                document.body.classList.add("shine");

                for (let i = 0; i < 350; i++) {

                    const particle = document.createElement("div");

                    particle.className = "particle";
                    particle.innerHTML = ["❤️", "💖", "💕", "💘", "✨"]
                    [Math.floor(Math.random() * 5)];

                    particle.style.left = "50%";
                    particle.style.top = "50%";

                    particle.style.fontSize =
                        (Math.random() * 40 + 15) + "px";

                    particle.style.setProperty(
                        "--x",
                        (Math.random() * 2500 - 1250) + "px"
                    );

                    particle.style.setProperty(
                        "--y",
                        (Math.random() * 2500 - 1250) + "px"
                    );

                    particle.style.filter =
                        `drop-shadow(0 0 ${Math.random() * 15 + 5}px white)`;

                    document.body.appendChild(particle);

                    setTimeout(() => {
                        particle.remove();
                    }, 4000);
                }

                document.body.style.background =
                    "radial-gradient(circle,rgb(255,255,255),rgb(255,140,200),rgb(255,70,150))";

            }, 1200);
        });

    </script>

</body>

</html>
